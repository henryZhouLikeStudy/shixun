<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://images.shixun.local data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'"><title>拾讯</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="comfort.css"><link rel="stylesheet" href="client.css"></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-icon">◔</span><div><strong>拾讯</strong><small>YOUR DAILY SIGNAL</small></div></div><div class="workspace">个人阅读空间<span>本地加密</span></div><nav id="navigation" aria-label="阅读导航"></nav><div class="sidebar-bottom"><button id="settingsButton" class="nav">⚙　设置与偏好</button><div id="syncState" class="sync-state">准备就绪</div></div></aside><section class="feed"><div class="feed-top"><div class="eyebrow">为值得关注的事，留一点空间</div><div class="heading"><h1 id="viewTitle">全部动态</h1><button id="syncButton" class="icon" aria-label="立即同步">↻</button></div><label class="search"><span>⌕</span><input id="search" placeholder="搜索标题、内容或来源" aria-label="搜索文章"><kbd>Ctrl K</kbd></label><div class="filter-row"><span id="itemCount"></span><button id="markAll" class="subtle">全部已读</button><select id="sort" aria-label="排序"><option value="new">最新优先</option><option value="old">最早优先</option></select></div></div><div id="articles" class="articles"></div><footer class="prototype-label">本地阅读 · 内容由你选择</footer></section><main id="detail" class="detail"></main></div>
<dialog id="settings" class="settings"><div class="settings-layout"><aside><div class="settings-brand">偏好设置<small>让拾讯适合你</small></div><nav id="settingsNavigation"></nav><div class="settings-version">拾讯 1.0.0<br>免费 · GPL-3.0-only</div></aside><section class="settings-main"><header><div><div class="eyebrow">SETTINGS</div><h2 id="settingsTitle"></h2></div><button id="closeSettings" class="icon" aria-label="关闭设置">×</button></header><div id="settingsContent"></div><footer><span id="savedState">设置在本机加密保存</span><button id="exit" class="subtle">退出程序</button></footer></section></div></dialog>
<dialog id="editor" class="small-dialog"></dialog><dialog id="shareDialog" class="small-dialog"></dialog><dialog id="lightbox"><button id="closeLightbox" class="icon" aria-label="关闭大图">×</button><img id="largeImage" alt="文章配图"></dialog><div id="feedback" role="status" class="feedback" hidden></div><script src="client.js"></script></body></html>
